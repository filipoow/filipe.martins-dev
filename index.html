<style>
:root{--bg:#0A0A0A;--surf:rgba(255,255,255,.03);--ink:#FFFFFF;--mut:rgba(255,255,255,.5);--mut2:rgba(255,255,255,.32);--bd:rgba(255,255,255,.13);--bd2:rgba(255,255,255,.075);--acc:#B8FF4F;--acc-ink:#0A0A0A;--acc-soft:rgba(184,255,79,.14)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none;transition:opacity .2s,color .2s}
a:hover{color:var(--acc);opacity:1}
strong{font-weight:700;color:var(--ink)}
.dim{color:var(--mut2)}
.acc{color:var(--acc)}
.prog{position:fixed;top:0;left:0;height:2px;background:var(--acc);z-index:200;transition:width .1s linear}
.nav-wrap{position:fixed;top:0;left:0;right:0;z-index:150;display:flex;justify-content:space-between;align-items:center;max-width:1392px;margin:0 auto;padding:22px 56px;pointer-events:none}
.nav,.lang{pointer-events:auto}
.nav{display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:999px;background:rgba(20,20,20,.72);backdrop-filter:blur(14px);border:1px solid var(--bd2)}
.nav-toggle{border:none;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;width:16px;height:16px}
.bars path{transition:transform .34s cubic-bezier(.4,0,.2,1);transform-box:fill-box;transform-origin:center}
.bars.x .b1{transform:translateY(4.5px) rotate(45deg)}
.bars.x .b2{transform:translateY(-4.5px) rotate(-45deg)}
.nav-brand{font-weight:600;font-size:14px;letter-spacing:-.015em;white-space:nowrap}
.nav-links{display:flex;gap:18px;max-width:0;opacity:0;overflow:hidden;margin-left:0;transition:max-width .45s cubic-bezier(.4,0,.2,1),opacity .3s,margin-left .45s cubic-bezier(.4,0,.2,1)}
.nav-open .nav-links{max-width:520px;opacity:1;margin-left:18px}
.nav-links a{font-size:13.5px;font-weight:500;color:var(--mut);white-space:nowrap}
.nav-links a:hover{color:#fff;opacity:1}
.lang{width:36px;height:36px;border-radius:999px;border:1px solid var(--bd2);background:rgba(20,20,20,.72);backdrop-filter:blur(14px);color:var(--ink);font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background .2s}
.lang:hover{background:rgba(255,255,255,.1)}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:130px 56px 90px;overflow:hidden}

.hero-grid{width:100%;max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1.06fr .94fr;gap:56px;align-items:center}
.loc{display:inline-flex;align-items:center;gap:9px;padding:8px 15px;border-radius:999px;border:1px solid var(--bd);font-size:11.5px;font-weight:500;letter-spacing:.02em;color:var(--mut);margin-bottom:34px}

.hero-title{margin:0;font-size:clamp(38px,4.7vw,66px);font-weight:700;line-height:1.05;letter-spacing:-.045em}

.hero-ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}

.pill-solid:hover{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);box-shadow:0 8px 26px rgba(184,255,79,.22)}
.hero-r{position:relative;min-height:600px;display:flex;justify-content:center}
.rig-wrap{position:relative;width:100%;display:flex;justify-content:center}
.side-tag{position:absolute;right:4px;top:120px;writing-mode:vertical-rl;font-size:10.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--mut2)}
.tilt-ask{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);padding:9px 17px;border:1px solid var(--bd2);border-radius:999px;background:rgba(255,255,255,.04);color:var(--mut);font:inherit;font-size:11.5px;font-weight:500;letter-spacing:.01em;white-space:nowrap;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tilt-ask:active{background:rgba(255,255,255,.1);color:#fff}
.rig{position:absolute;top:-190px;transform-origin:50% 0;display:flex;flex-direction:column;align-items:center;will-change:transform}
.strap{width:32px;height:252px;background:linear-gradient(90deg,#131313,#1E1E1E 30%,#232323 50%,#1A1A1A 72%,#101010);border-left:1px solid rgba(255,255,255,.09);border-right:1px solid rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;overflow:hidden}
.strap span{writing-mode:vertical-rl;font-size:8.5px;font-weight:600;letter-spacing:.34em;color:rgba(255,255,255,.38);white-space:nowrap}
.clip{width:50px;height:23px;border-radius:5px;background:linear-gradient(180deg,#EFEFEF,#8C8C8C);position:relative;box-shadow:0 4px 12px rgba(0,0,0,.6);flex-shrink:0}
.clip::after{content:"";position:absolute;inset:6px 9px;border-radius:2px;background:#0A0A0A}

.badge-foot{padding:15px 4px 0}
.badge-name{margin:0;font-size:21px;font-weight:700;letter-spacing:-.035em;color:#0A0A0A}

.badge-pills{display:flex;gap:6px;margin-top:15px}
.badge-pills span{font-size:10px;font-weight:600;letter-spacing:.05em;padding:5px 12px;border-radius:999px;border:1px solid rgba(10,10,10,.16);color:rgba(10,10,10,.6)}
.sec{max-width:1280px;margin:0 auto;padding:104px 56px}
.sec-h{margin:0 auto 44px;text-align:center;font-size:clamp(30px,4vw,52px);font-weight:700;line-height:1.05;letter-spacing:-.045em;max-width:900px;text-wrap:balance}
[data-rv]{opacity:0;transform:translateY(22px);transition:opacity .75s cubic-bezier(.2,.7,.2,1),transform .75s cubic-bezier(.2,.7,.2,1)}
[data-rv].in{opacity:1;transform:none}
.pop{animation:pop .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.skills{position:relative;min-height:520px;display:grid;place-items:center}
.field{position:absolute;inset:0;overflow:hidden}
.tile{position:absolute;width:60px;height:60px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.045);border:1px solid var(--bd);transform:rotate(var(--rot)) translate(calc(var(--dx) * var(--k)),calc(var(--dy) * var(--k)))}
.mark{display:block;background:var(--mc,#fff);-webkit-mask:var(--mi) center/contain no-repeat;mask:var(--mi) center/contain no-repeat}
.mark-w{filter:brightness(0) invert(1);opacity:.82}
.mark-fb{font-size:9px;font-weight:700;line-height:1.15;text-align:center;padding:4px;color:#fff}
.skills-h{position:relative;z-index:3;margin:0;text-align:center;font-size:clamp(19px,2.2vw,25px);font-weight:600;letter-spacing:-.03em;line-height:1.35;padding:14px 24px;background:rgba(10,10,10,.75);backdrop-filter:blur(10px);border-radius:12px}
.stats-sec{text-align:center}
.stats-h{margin:0 0 48px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.22em;color:var(--mut2)}
.stat-one{display:flex;flex-direction:column;align-items:center;gap:26px;opacity:0;transform:translateY(10px);transition:opacity .32s ease,transform .32s ease}
.stat-one.on{opacity:1;transform:translateY(0)}
.stat-ico{width:88px;height:88px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.045);border:1px solid var(--bd)}
.stat-line{margin:0;font-size:clamp(23px,3.1vw,37px);font-weight:700;letter-spacing:-.04em;line-height:1.15;color:var(--mut)}
.stat-line .acc{color:var(--acc)}
.stat-dots{margin-top:34px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:26px}
.dot{width:7px;height:7px;border-radius:999px;border:none;background:var(--bd);cursor:pointer;padding:0;transition:width .3s,background .3s}
.dot.on{width:26px;background:var(--acc)}
.marq{margin-top:16px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.marq:first-of-type{margin-top:66px}
.marq-in{display:flex;gap:10px;width:max-content;animation:marq 50s linear infinite}
.marq-in.rev{animation:marqr 56s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes marqr{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.marq-t{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--bd2);display:grid;place-items:center;flex-shrink:0}
.work-sec .sec-h{margin-bottom:28px}
.anchor{display:block;position:relative;top:-70px;height:0}
.tabs{position:relative;display:flex;gap:4px;padding:5px;margin:0 auto 34px;width:max-content;max-width:100%;background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:999px}
.tab-ind{position:absolute;top:5px;bottom:5px;left:0;border-radius:999px;background:var(--acc);z-index:0;transition:transform .4s cubic-bezier(.4,0,.2,1),width .4s cubic-bezier(.4,0,.2,1),opacity .25s}
.tab{position:relative;z-index:1;border:none;background:none;padding:10px 24px;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--mut);cursor:pointer;white-space:nowrap;transition:color .3s}
.tab.on{color:var(--acc-ink)}
.tab-new{position:absolute;top:-7px;right:0;background:var(--acc);color:var(--acc-ink);font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:999px;letter-spacing:.05em}
.tab-hint{text-align:center;margin:0 auto 32px;font-size:14.5px;color:var(--mut);max-width:560px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:rgba(255,255,255,.026);border:1px solid var(--bd2);border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:12px;transition:transform .25s,border-color .25s,background .25s}
.card:hover{transform:translateY(-4px);border-color:rgba(184,255,79,.35);background:rgba(255,255,255,.045)}
.card-shot{position:relative;aspect-ratio:16/10;border-radius:13px;overflow:hidden;background:rgba(255,255,255,.04)}
.card-meta{display:flex;gap:7px;align-items:center;font-size:12.5px;font-weight:500;color:var(--mut2);white-space:nowrap;padding-top:2px}
.card-t{margin:0;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1.22}
.card-d{margin:0;font-size:13.5px;line-height:1.55;color:var(--mut);flex:1}
.card-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;padding-top:14px;border-top:1px solid var(--bd2)}
.card-m{font-size:30px;font-weight:700;letter-spacing:-.045em;line-height:1;color:var(--acc);transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.card:hover .card-m{transform:scale(1.06)}
.card-ml{margin-top:5px;font-size:11.5px;line-height:1.4;color:var(--mut2);max-width:190px}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:140px}
.card-tags span{font-size:10.5px;font-weight:500;padding:4px 9px;border-radius:999px;border:1px solid var(--bd2);color:var(--mut);white-space:nowrap}
.filka{display:grid;grid-template-columns:1.5fr 1fr;gap:44px;background:rgba(255,255,255,.026);border:1px solid var(--bd2);border-radius:22px;padding:44px}
.filka-badge{display:inline-block;padding:10px 19px;border-radius:12px;background:#fff;color:#0A0A0A;font-size:22px;font-weight:800;letter-spacing:-.035em}
.filka-kick{margin:20px 0 0;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2)}
.filka-t{margin:12px 0 0;font-size:clamp(24px,2.8vw,33px);font-weight:700;letter-spacing:-.035em;line-height:1.16;text-wrap:balance}
.filka-b{margin:18px 0 30px;font-size:15.5px;line-height:1.62;color:var(--mut);max-width:620px;text-wrap:pretty}
.filka-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.filka-list li{padding:14px 17px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--bd2);font-size:14.5px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:999px;border:1px solid var(--bd);font-size:14px;font-weight:600;white-space:nowrap;transition:transform .22s,background .22s}
.btn:hover{transform:translateY(-2px);opacity:1}
.btn svg{transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.btn:hover svg{transform:translate(3px,-3px)}
.btn-dark{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.term{background:#101010;border:1px solid var(--bd);border-radius:16px;overflow:hidden;max-width:900px;margin:0 auto;cursor:text}
.term-bar{display:flex;align-items:center;gap:8px;padding:13px 16px;background:rgba(255,255,255,.04);position:relative}
.tl{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.22)}
.term-title{position:absolute;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mut2)}
.term-body{padding:18px;height:400px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.75;color:rgba(255,255,255,.7)}
.term-out{white-space:pre-wrap;min-height:1.75em}
.term-in{display:flex;gap:9px;color:#fff}
.term-ps{color:var(--acc);flex-shrink:0;opacity:.9}
.term-form{display:flex;gap:9px;align-items:center}
.term-form input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:13px;color:#fff;caret-color:#fff}
.exp-grid{display:grid;grid-template-columns:250px 1fr;gap:56px;align-items:start}
.exp-aside{position:sticky;top:120px;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.exp-kicker{margin:0;font-size:27px;font-weight:700;line-height:1.1;letter-spacing:-.045em;color:#fff}
.exp-span{display:flex;flex-direction:column;align-items:flex-start;gap:12px;font-size:11px;font-weight:600;color:var(--mut2);letter-spacing:.16em}
.exp-line{width:1px;height:120px;background:linear-gradient(180deg,var(--acc),var(--bd2));transform:scaleY(0);transform-origin:50% 0;transition:transform 1.1s .15s cubic-bezier(.2,.7,.2,1)}
.exp-sec.in .exp-line{transform:scaleY(1)}
.exp-list{display:flex;flex-direction:column;gap:46px}
.exp-row{position:relative;padding-top:26px}
.exp-row::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--bd2);transform:scaleX(0);transform-origin:0 50%;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.exp-row.in::before{transform:scaleX(1)}
.exp-row::after{content:"";position:absolute;top:-3px;left:0;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--acc-soft);opacity:0;transform:scale(.2);transition:opacity .5s .34s,transform .55s .34s cubic-bezier(.2,.7,.2,1)}
.exp-row.in::after{opacity:1;transform:scale(1)}

.exp-row.in .exp-b li:nth-child(3){transition-delay:.48s}
.exp-role{margin:0;font-size:clamp(20px,2.2vw,27px);font-weight:700;letter-spacing:-.035em;line-height:1.22}
.exp-period{margin:6px 0 16px;font-size:13px;font-weight:500;color:var(--mut2)}

.exp-b li{font-size:15.5px;line-height:1.55;color:var(--mut)}

.quote-f{display:flex;gap:13px;align-items:center;justify-content:center}

.quote-id{display:flex;flex-direction:column;text-align:left}
.ava{position:relative;width:42px;height:42px;border-radius:50%;background:#fff;color:#0A0A0A;display:grid;place-items:center;font-size:14px;font-weight:700;flex-shrink:0;overflow:hidden}

.ava-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.ava-in{position:relative;z-index:1}
